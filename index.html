<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EDE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study AI">
<title>Study AI</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --paper: #F3EDE3;
  --card: #FFFCF7;
  --ink: #1A1714;
  --ink-2: #5C564E;
  --ink-3: #8A8278;
  --line: #E4D9C8;
  --accent: #1F6B4A;
  --accent-soft: #E4F0E8;
  --mark: #E8A317;
  --mark-soft: #F8EBC7;
  --bad: #C23B22;
  --bad-soft: #F8E4DF;
  --shadow: 0 10px 28px -18px rgba(26,23,20,.45);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
[data-theme="dark"] {
  --paper: #161411;
  --card: #221E19;
  --ink: #F3EDE3;
  --ink-2: #C4B8A8;
  --ink-3: #8A8278;
  --line: #3A342C;
  --accent: #5EBA8A;
  --accent-soft: #1C3228;
  --mark: #E8A317;
  --mark-soft: #3A2E14;
  --bad: #E07A6A;
  --bad-soft: #3A221E;
  --shadow: 0 10px 28px -16px #000;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 17px/1.45 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  padding-top: var(--safe-t);
}
button, input { font: inherit; }
button { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }

.app { max-width: 440px; margin: 0 auto; min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
.wide { max-width: 720px; }
.app.study { max-width: min(1040px, 100%); }

.top {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 20px 8px;
}
.top h1 { font-size: 28px; letter-spacing: -.03em; margin: 0; font-weight: 700; }
.top .sub { margin: 2px 0 0; color: var(--ink-2); font-size: 15px; }
.spacer { flex: 1; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card);
  display: grid; place-items: center; cursor: pointer;
}
.iconbtn svg { width: 18px; height: 18px; }

.pad { padding: 8px 20px 20px; }

.pack {
  display: block; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 16px 16px 14px; margin: 0 0 10px; box-shadow: var(--shadow);
}
.pack-hit {
  display: block; width: 100%; text-align: left; cursor: pointer;
  border: 0; background: none; padding: 0; color: inherit;
}
.pack-top { display: flex; align-items: baseline; gap: 8px; }
.pack h2 { margin: 0; font-size: 20px; }
.pack .n { margin-left: auto; font-family: ui-sans-serif, system-serif, sans-serif; font-size: 12px; color: var(--ink-3); }
.pack p { margin: 6px 0 10px; color: var(--ink-2); font-size: 15px; }
.words {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.words button {
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 13px; padding: 5px 9px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
}
.dots { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots.big { gap: 9px; margin: 4px 20px 10px; }
.dots.big .dot { width: 12px; height: 12px; }
.dots.big .dot.now { background: var(--ink); }

.pairs { margin-top: 22px; }
.pairs h3 { font-size: 15px; margin: 0 0 8px; color: var(--ink-2); font-weight: 600; }
.pair {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 13px 14px; margin-bottom: 8px;
}
.pair b { display: block; font-size: 15px; margin-bottom: 4px; }
.pair span { color: var(--ink-2); font-size: 15px; }

.stage {
  flex: 0 0 auto;
  min-width: 0;
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  padding: 0 16px;
  align-items: start;
  overflow: visible;
  touch-action: pan-y;
  -webkit-user-select: none;
  user-select: none;
}
.col-read {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.col-read .row { padding: 10px 0 0; }
.sheet {
  margin: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 20px;
  box-shadow: var(--shadow); padding: 18px 16px 16px;
  overflow-wrap: anywhere;
}
.viz {
  margin: 0;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 12px;
  min-width: 0;
  overflow: visible;
  display: flex;
  align-items: stretch;
}
.viz > * { width: 100%; min-height: 0; }
.term { font-size: clamp(26px, 8vw, 38px); letter-spacing: -.03em; margin: 0 0 10px; line-height: 1.1; }
.aka { color: var(--ink-3); margin: 0; }
.one { font-size: clamp(18px, 4.6vw, 21px); line-height: 1.3; margin: 0 0 16px; }
.sheet p.more { margin: 0 0 12px; color: var(--ink-2); }
.sheet p.more:last-child { margin-bottom: 0; }
.row { display: flex; gap: 8px; padding: 14px 20px 0; }
.app.study {
  display: flex;
  flex-direction: column;
  height: auto;
  min-height: 100dvh;
}
.app.study .pad.quiz {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
}
.app.study > .row {
  flex: 0 0 auto;
  margin-top: auto;
  padding: 12px 20px 0;
}
.btn {
  font-family: ui-sans-serif, system-ui, sans-serif;
  border: 1px solid var(--line); background: var(--card); border-radius: 12px;
  padding: 12px 14px; cursor: pointer; flex: 1;
  min-height: 44px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
[data-theme="dark"] .btn.primary { color: #122018; }
.btn.ghost { background: transparent; }
.btn.good { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
.btn.again { background: var(--mark-soft); border-color: transparent; color: #8A5A00; font-weight: 600; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
[data-theme="dark"] .btn.again { color: var(--mark); }

.quiz .q { font-size: 22px; margin: 0 0 16px; }
.opt {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 14px; margin-bottom: 8px;
}
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt.ok { border-color: var(--accent); background: var(--accent-soft); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); }

.search {
  width: 100%; border: 1px solid var(--line); background: var(--card);
  border-radius: 12px; padding: 12px 14px; color: var(--ink); margin-bottom: 12px;
}
.gitem {
  padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer;
  background: none; border-left: 0; border-right: 0; border-top: 0;
  width: 100%; text-align: left; border-radius: 0;
}
.gitem b { display: block; font-size: 18px; }
.gitem span { color: var(--ink-2); font-size: 15px; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 8px 16px calc(10px + var(--safe-b));
  display: flex; justify-content: center; gap: 8px;
}
.nav button {
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 12px; font-weight: 600;
  border: 0; background: transparent; padding: 8px 16px; border-radius: 999px;
  color: var(--ink-3); cursor: pointer;
}
.nav button.on { background: var(--card); color: var(--ink); }

.done {
  text-align: center; padding: 40px 20px;
}
.done h2 { font-size: 28px; margin: 0 0 8px; }
.done p { color: var(--ink-2); }

.v-art, .v-editor { font-family: ui-sans-serif, system-ui, sans-serif; height: 100%; }
.v-kicker {
  display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px;
}
.v-note, .v-art > small, .v-panel small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 10px; }
.v-chip {
  display: inline-block; font-size: 12px; font-weight: 600;
  padding: 4px 8px; margin: 0 4px 6px 0; border-radius: 8px;
  background: var(--paper); border: 1px solid var(--line); color: var(--ink);
}
.v-chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.v-chip.dim { opacity: .7; }
.v-cut-row { display: flex; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.v-meta { font-size: 12px; color: var(--ink-3); margin-left: 4px; }

.v-desk { position: relative; min-height: 220px; }
.v-paper {
  position: absolute; background: var(--paper); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--ink-2);
  box-shadow: var(--shadow); width: 58%;
}
.v-paper b { display: block; color: var(--ink); font-size: 12px; }
.v-paper.a { top: 8px; left: 8px; transform: rotate(-4deg); }
.v-paper.b { top: 72px; left: 28%; width: 62%; transform: rotate(3deg); }
.v-paper.c { top: 138px; left: 12%; width: 56%; transform: rotate(-1deg); }
.v-broom { position: absolute; bottom: 4px; right: 8px; font-size: 12px; color: var(--ink-3); }

.v-io { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; min-width: 0; }
.v-slip {
  border-radius: 14px; padding: 12px; border: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0;
}
.v-slip b { font-size: 15px; line-height: 1.25; }
.v-slip em { font-style: normal; font-size: 28px; letter-spacing: -.03em; margin-top: auto; }
.v-slip.cheap { background: var(--accent-soft); border-color: transparent; }
.v-slip.cheap em { color: var(--accent); }
.v-slip.dear { background: var(--mark-soft); border-color: transparent; }
.v-slip.dear em { color: #8A5A00; }
[data-theme="dark"] .v-slip.dear em { color: var(--mark); }

.v-folder { display: flex; flex-direction: column; gap: 10px; height: 100%; }
.v-tab { font-size: 12px; font-weight: 700; color: var(--ink-3); }
.v-hidden, .v-msg {
  border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--ink-2);
}
.v-hidden { background: var(--mark-soft); border: 1px dashed color-mix(in srgb, var(--mark) 45%, var(--line)); }
.v-hidden p, .v-msg p { margin: 8px 0 0; }
.v-seal {
  font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: #8A5A00;
}
[data-theme="dark"] .v-seal { color: var(--mark); }
.v-msg { background: var(--paper); border: 1px solid var(--line); }

.v-stack { display: flex; flex-direction: column; gap: 8px; }
.v-leaf {
  border-radius: 10px; padding: 10px 12px; font-size: 14px;
  background: var(--paper); border: 1px solid var(--line);
}
.v-leaf.sharp { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
.v-leaf.sharp b { display: block; font-size: 12px; color: var(--accent); }
.v-leaf.mid { opacity: .75; }
.v-leaf.fade { opacity: .45; }
.v-leaf.gone { opacity: .22; }

.v-split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 100%; min-width: 0; }
.v-panel {
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px; font-size: 14px; color: var(--ink-2);
  min-width: 0; overflow-wrap: anywhere;
}
.v-panel.on { background: var(--accent-soft); border-color: transparent; }
.v-panel.junk { background: var(--bad-soft); border-color: transparent; }
.v-panel.dim { opacity: .72; }
.v-panel ol { margin: 8px 0; padding-left: 18px; color: var(--ink); }
.v-bubble {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; color: var(--ink); font-size: 14px;
}
.v-panel.on .v-bubble { background: var(--card); }

.v-harness { text-align: center; }
.v-node.brain {
  display: inline-block; padding: 8px 16px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px;
}
.v-loop { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 14px 0; }
.v-loop span {
  font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--paper);
}
.v-loop .stop { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.v-harness p { margin: 0; color: var(--ink-2); font-size: 13px; }

.v-permit {
  border: 1px solid var(--line); border-radius: 14px; padding: 16px;
  background: var(--paper); height: 100%;
}
.v-permit h3 { margin: 0 0 8px; font-size: 20px; }
.v-permit ul { margin: 0; padding: 0; list-style: none; }
.v-permit li { display: flex; align-items: center; gap: 8px; padding: 6px 0; color: var(--ink); }
.v-permit i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.v-permit p { margin: 14px 0 0; color: var(--ink-3); font-size: 13px; }

.v-plugs { display: flex; align-items: center; gap: 10px; margin-top: 8px; min-width: 0; flex-wrap: wrap; }
.v-box {
  background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 12px; font-weight: 700; text-align: center; min-width: 72px;
}
.v-box.sm { padding: 8px 10px; font-size: 13px; margin-bottom: 6px; }
.v-col { display: flex; flex-direction: column; }
.v-cord {
  flex: 1; height: 4px; background: var(--accent); position: relative; border-radius: 99px;
}
.v-cord span {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: var(--accent); color: #fff; font-size: 10px; font-weight: 800;
  letter-spacing: .08em; padding: 4px 8px; border-radius: 999px;
}
[data-theme="dark"] .v-cord span { color: #122018; }

.v-recipe { display: flex; flex-direction: column; gap: 10px; height: 100%; }
.v-box-lid {
  font-size: 12px; font-weight: 700; color: var(--ink-3);
  border-bottom: 2px solid var(--line); padding-bottom: 6px;
}
.v-card-sm {
  background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; flex: 1;
}
.v-card-sm b { display: block; font-size: 16px; }
.v-trig {
  display: inline-block; margin: 8px 0; font-size: 12px; font-weight: 700;
  color: var(--accent); background: var(--accent-soft); padding: 4px 8px; border-radius: 999px;
}
.v-card-sm hr { border: 0; border-top: 1px dashed var(--line); margin: 10px 0; }
.v-steps { font-size: 14px; color: var(--ink); line-height: 1.5; margin: 8px 0; }

.v-editor {
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
  overflow: hidden; display: flex; flex-direction: column; min-height: 100%;
}
.v-ebar {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--card) 80%, var(--paper));
}
.v-traffic { display: flex; gap: 5px; }
.v-traffic i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.v-traffic i:first-child { background: #E07A6A; }
.v-traffic i:nth-child(2) { background: var(--mark); }
.v-traffic i:nth-child(3) { background: var(--accent); }
.v-fname { font-size: 12px; font-weight: 700; }
.v-badge {
  margin-left: auto; font-size: 10px; font-weight: 800; letter-spacing: .06em;
  text-transform: uppercase; background: var(--accent-soft); color: var(--accent);
  padding: 3px 7px; border-radius: 999px;
}
.v-badge.warm { background: var(--mark-soft); color: #8A5A00; }
[data-theme="dark"] .v-badge.warm { color: var(--mark); }
.v-md {
  margin: 0; padding: 14px 16px 16px; font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--ink-2); white-space: pre-wrap; flex: 1;
}
.v-md .h { color: var(--ink); font-weight: 700; }
.v-md .c { color: var(--ink-3); }
.v-md .em { color: var(--accent); }
.v-md .no { color: var(--bad); }
.v-twin { position: relative; height: 100%; min-height: 260px; }
.v-twin .faded {
  position: absolute; inset: 18px 28% 28px 0; transform: rotate(-4deg);
  opacity: .55; pointer-events: none;
}
.v-twin .front { position: relative; margin-left: 12%; min-height: 100%; }
.v-twin .short { padding-bottom: 8px; }
.v-editor.claude .v-ebar { border-bottom-color: color-mix(in srgb, var(--mark) 40%, var(--line)); }

.v-toc ul { list-style: none; margin: 0; padding: 0; }
.v-toc li { padding: 8px 10px; border-radius: 10px; color: var(--ink-2); font-size: 14px; }
.v-toc li span { display: inline-block; width: 18px; color: var(--ink-3); }
.v-toc li.open { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.v-toc li.dim { opacity: .45; }
.v-chapter { margin: 8px 0 0 18px; font-weight: 400; font-size: 13px; color: var(--ink-2); }

.v-magic { font-size: 13px; font-style: italic; color: var(--ink-3); margin: 8px 0; }
.v-folder-list { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.v-folder-list b { color: var(--ink); }
.v-folder-list span {
  background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 8px; font-size: 13px; color: var(--ink);
}

.v-vibe { display: flex; flex-direction: column; gap: 8px; }
.v-bubble.you { border-radius: 14px 14px 4px 14px; }
.v-bubble.soft { opacity: .8; }
.v-code {
  background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
}
.v-code pre { margin: 6px 0 0; font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); }

.v-plates { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
.v-plates i {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--paper); border: 1px solid var(--line);
}
.v-plates i.pick {
  width: 44px; height: 44px; background: var(--accent-soft);
  border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
}
.v-serve { font-size: 14px; color: var(--ink); font-weight: 600; }

.v-plan { display: flex; flex-direction: column; gap: 10px; height: 100%; }
.v-sketch, .v-build {
  background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
}
.v-sketch ul { margin: 6px 0 8px; padding-left: 18px; color: var(--ink); font-size: 14px; }
.v-sketch .x { color: var(--bad); text-decoration: line-through; }
.v-sketch .ok { font-style: normal; font-size: 12px; font-weight: 800; color: var(--accent); }
.v-arrow { text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
.v-build p { margin: 6px 0 0; color: var(--ink); }

.v-score table { width: 100%; border-collapse: collapse; font-size: 14px; }
.v-score td { padding: 8px 0; border-bottom: 1px solid var(--line); }
.v-score td:first-child { color: var(--ink-3); width: 72px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.v-score tr.pass td { border-bottom: 0; color: var(--accent); font-weight: 700; }

.v-cite {
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 16px; position: relative;
}
.v-cite p { margin: 0 0 12px; font-size: 16px; color: var(--ink); }
.v-cite .fake { background: var(--bad-soft); color: var(--bad); padding: 0 4px; border-radius: 4px; }
.v-stamp {
  display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; color: var(--bad); border: 2px solid var(--bad);
  padding: 4px 8px; border-radius: 6px; transform: rotate(-8deg);
}

.v-time { display: flex; flex-direction: column; gap: 8px; }
.v-time .t { border-radius: 10px; padding: 10px 12px; background: var(--paper); border: 1px solid var(--line); font-size: 14px; }
.v-time .t b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.v-time .sharp { background: var(--accent-soft); border-color: transparent; }
.v-time .mid { opacity: .7; }
.v-time .fade { opacity: .38; }

.v-midlist { list-style: none; margin: 0; padding: 0; }
.v-midlist li { padding: 7px 10px; border-radius: 8px; font-size: 14px; }
.v-midlist .sharp { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.v-midlist .lost { background: var(--bad-soft); color: var(--bad); }
.v-midlist .ghost { color: var(--ink-3); opacity: .45; }

.v-desks { display: flex; align-items: center; gap: 8px; }
.v-mini {
  flex: 1; background: var(--paper); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px; text-align: center;
}
.v-mini span { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.v-mini p { margin: 8px 0 0; font-weight: 600; }
.v-mini.clean { background: var(--accent-soft); border-color: transparent; }
.v-send { font-size: 12px; font-weight: 700; color: var(--ink-3); }
.v-back {
  margin-top: 12px; background: var(--paper); border: 1px dashed var(--line);
  border-radius: 12px; padding: 12px; font-size: 14px; color: var(--ink);
}

.v-mem { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: 100%; }
.v-cleared, .v-fridge {
  border-radius: 14px; padding: 14px; border: 1px solid var(--line); background: var(--paper);
}
.v-empty {
  margin-top: 28px; text-align: center; color: var(--ink-3); font-size: 13px;
  border: 1px dashed var(--line); border-radius: 10px; padding: 28px 8px;
}
.v-sticky {
  background: var(--mark-soft); color: var(--ink); padding: 12px;
  border-radius: 4px 12px 12px 12px; font-size: 14px; font-weight: 600;
  transform: rotate(2deg); margin-bottom: 12px;
}
.v-fridge span { font-size: 12px; color: var(--ink-3); }

.v-tape {
  background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px; text-align: center; color: var(--ink-3); font-size: 13px;
}
.v-arrow.down { text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-3); padding: 6px 0; letter-spacing: .08em; text-transform: uppercase; }
.v-notes {
  background: var(--accent-soft); border-radius: 12px; padding: 14px;
}
.v-notes b { display: block; margin-bottom: 6px; }
.v-notes p { margin: 0 0 8px; color: var(--ink); font-size: 14px; }
.v-notes em { font-style: normal; font-size: 12px; color: var(--accent); font-weight: 700; }

.v-book {
  margin: 12px 0; background: var(--card); border: 1px solid var(--line);
  border-radius: 6px 12px 12px 6px; padding: 22px 12px; font-weight: 700; text-align: center;
  box-shadow: inset 4px 0 0 var(--accent);
}
.v-shelf { display: flex; gap: 4px; height: 72px; align-items: flex-end; margin: 12px 0; }
.v-shelf i { flex: 1; background: var(--line); border-radius: 3px 3px 0 0; }
.v-shelf i:nth-child(2) { height: 80%; }
.v-shelf i:nth-child(3) { height: 60%; }
.v-shelf i:nth-child(4) { height: 90%; }
.v-shelf i:nth-child(5) { height: 50%; }

@media (max-width: 799px) {
  .top { padding: 14px 16px 6px; }
  .top h1 { font-size: 24px; }
  .pad { padding: 8px 16px 20px; }
  .v-slip em { font-size: 22px; }
  .v-slip b { font-size: 13px; }
  .v-md { font-size: 12px; }
  .v-twin { min-height: 240px; }
  .v-twin .front { margin-left: 8%; }
  .v-desk { min-height: 200px; }
  .v-ebar { flex-wrap: wrap; row-gap: 6px; }
  .v-badge { margin-left: 0; }
}
@media (min-width: 800px) {
  .app { max-width: 560px; padding-top: 12px; }
  .app.study { max-width: min(1040px, calc(100% - 40px)); height: auto; min-height: 100dvh; }
  .stage { grid-template-columns: minmax(280px, 1fr) minmax(300px, 1.05fr); gap: 16px; padding: 0 20px; }
  .sheet { padding: 22px 22px 20px; }
  .viz { padding: 16px; overflow: auto; min-height: 0; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav sans" id="nav"></nav>
<meta http-equiv="Cache-Control" content="no-store">
<script src="cards.js?v=12"></script>
<script src="viz.js?v=3"></script>
<script>
(function () {
  const KEY = "study-ai.v1";
  const $ = (id) => document.getElementById(id);
  const app = $("app");
  const nav = $("nav");

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function save(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }

  const state = {
    view: "home",
    pack: null,
    i: 0,
    flipped: false,
    quiz: null,
    qI: 0,
    picked: null,
    search: "",
    store: Object.assign({ theme: "light" }, load())
  };

  document.documentElement.setAttribute("data-theme", state.store.theme === "dark" ? "dark" : "light");
  document.querySelector('meta[name="theme-color"]').setAttribute(
    "content", state.store.theme === "dark" ? "#161411" : "#F3EDE3"
  );

  function persist() { save(state.store); }

  function allIds() {
    return STUDY.packs.flatMap((p) => p.cards);
  }
  function packDots() {
    if (!state.pack) return "";
    return `<div class="dots big" aria-hidden="true">${state.pack.cards.map((id, n) =>
      `<i class="dot${n === state.i ? " now" : ""}"></i>`
    ).join("")}</div>`;
  }

  function go(view, extra) {
    state.view = view;
    Object.assign(state, extra || {});
    paint();
    window.scrollTo(0, 0);
  }

  function iconSun() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>';
  }
  function iconMoon() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>';
  }

  function topbar(title, sub, back) {
    return `<div class="top">
      ${back ? `<button class="iconbtn" id="back" aria-label="Back">${arrow()}</button>` : ""}
      <div><h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ""}</div>
      <span class="spacer"></span>
      <button class="iconbtn" id="theme" aria-label="Theme">${state.store.theme === "dark" ? iconSun() : iconMoon()}</button>
    </div>`;
  }
  function arrow() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>';
  }

  function home() {
    const packs = STUDY.packs.map((p) => {
      const chips = p.cards.map((id) =>
        `<button type="button" data-card="${id}">${STUDY.cards[id].term}</button>`
      ).join("");
      return `<div class="pack">
        <button class="pack-hit" data-pack="${p.id}">
          <div class="pack-top"><h2>${p.title}</h2><span class="n sans">${p.cards.length} cards</span></div>
          <p>${p.blurb}</p>
        </button>
        <div class="words">${chips}</div>
      </div>`;
    }).join("");

    const pairs = STUDY.pairs.map((x) =>
      `<div class="pair"><b>${x.left} ≠ ${x.right}</b><span>${x.line}</span></div>`
    ).join("");

    app.classList.remove("wide", "study");
    app.innerHTML = `
      ${topbar("Study AI")}
      <div class="pad">${packs}
        <div class="pairs">
          <h3 class="sans">Easy to mix up</h3>
          ${pairs}
        </div>
      </div>`;

    app.querySelectorAll("[data-pack]").forEach((el) => {
      el.onclick = () => startPack(el.dataset.pack);
    });
    app.querySelectorAll("[data-card]").forEach((el) => {
      el.onclick = (e) => { e.stopPropagation(); openCard(el.dataset.card); };
    });
  }

  function openCard(id) {
    const pack = STUDY.packs.find((p) => p.cards.includes(id));
    startPack(pack.id, pack.cards.indexOf(id));
  }

  function startPack(id, at) {
    state.pack = STUDY.packs.find((p) => p.id === id);
    state.i = at || 0;
    go("card");
  }

  function cardView() {
    const ids = state.pack.cards;
    const id = ids[state.i];
    const c = STUDY.cards[id];
    const last = state.i === ids.length - 1;

    app.classList.remove("wide");
    app.classList.add("study");
    app.innerHTML = `
      ${topbar(state.pack.title, (state.i + 1) + " of " + ids.length, true)}
      ${packDots()}
      <div class="stage">
        <div class="col-read">
          <div class="sheet">
            <h2 class="term">${c.term}</h2>
            <p class="one">${c.one}</p>
            <p class="more">${c.picture}</p>
            <p class="more">${c.hear}</p>
            <p class="more">${c.tip}</p>
          </div>
          <div class="row">
            <button class="btn" id="prev" ${state.i === 0 ? "disabled" : ""}>Back</button>
            <button class="btn primary" id="next">${last ? "Home" : "Next"}</button>
          </div>
        </div>
        <div class="viz" aria-hidden="true">${(window.VIZ && VIZ[id]) || ""}</div>
      </div>`;

    $("back").onclick = () => go("home");
    function goPrev() {
      if (state.i === 0) return;
      state.i -= 1;
      paint();
    }
    function goNext() {
      if (last) { go("home"); return; }
      state.i += 1;
      paint();
    }
    $("prev").onclick = goPrev;
    $("next").onclick = goNext;
    bindSwipe(app, goPrev, goNext);
  }

  function bindSwipe(el, goPrev, goNext) {
    if (!el) return;
    let x0 = 0, y0 = 0, locked = false, active = false;
    function ignore(t) {
      return !t || t.closest("button, a, input, .nav");
    }
    function start(x, y, t) {
      if (ignore(t)) return;
      active = true;
      locked = false;
      x0 = x;
      y0 = y;
    }
    function move(x, y, e) {
      if (!active) return;
      const dx = x - x0;
      const dy = y - y0;
      if (!locked && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) locked = true;
      if (locked && e.cancelable) e.preventDefault();
    }
    function end(x, y) {
      if (!active) return;
      active = false;
      const dx = x - x0;
      const dy = y - y0;
      if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
      if (dx < 0) goNext();
      else goPrev();
    }
    el.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 1) return;
      start(e.touches[0].clientX, e.touches[0].clientY, e.target);
    }, { passive: true });
    el.addEventListener("touchmove", (e) => {
      if (!active || e.touches.length !== 1) return;
      move(e.touches[0].clientX, e.touches[0].clientY, e);
    }, { passive: false });
    el.addEventListener("touchend", (e) => {
      const t = e.changedTouches[0];
      if (t) end(t.clientX, t.clientY);
      else active = false;
    }, { passive: true });
    el.addEventListener("touchcancel", () => { active = false; });
  }

  function startQuiz(ids, title) {
    state.quiz = { title, ids, score: 0 };
    state.qI = 0;
    state.picked = null;
    go("quiz");
  }

  function quizView() {
    const qz = state.quiz;
    app.classList.remove("wide");
    if (state.qI >= qz.ids.length) {
      app.classList.remove("study");
      const pct = Math.round((qz.score / qz.ids.length) * 100);
      app.innerHTML = `
        ${topbar("Quiz", qz.title, true)}
        <div class="done">
          <h2>${qz.score} / ${qz.ids.length}</h2>
          <p>${pct === 100 ? "All right." : "Read the cards again if you want."}</p>
          <div class="row" style="padding-top:24px">
            <button class="btn" id="homeBtn">Home</button>
            <button class="btn primary" id="redo">Again</button>
          </div>
        </div>`;
      $("back").onclick = $("homeBtn").onclick = () => go("home");
      $("redo").onclick = () => startQuiz(qz.ids, qz.title);
      return;
    }

    const c = STUDY.cards[qz.ids[state.qI]];
    const locked = state.picked !== null;
    const opts = c.opts.map((t, i) => {
      let cls = "opt";
      if (locked && i === c.a) cls += " ok";
      else if (locked && i === state.picked && i !== c.a) cls += " no";
      else if (!locked && i === state.picked) cls += " on";
      return `<button class="${cls}" data-i="${i}">${t}</button>`;
    }).join("");

    app.classList.add("study");
    app.innerHTML = `
      ${topbar("Quiz", `${state.qI + 1} of ${qz.ids.length}`, true)}
      <div class="pad quiz">
        <p class="q">${c.q}</p>
        ${opts}
      </div>
      <div class="row">
        <button class="btn primary" id="nextQ" ${locked ? "" : "disabled"}>${state.qI + 1 === qz.ids.length ? "See score" : "Next"}</button>
      </div>`;
    $("back").onclick = () => go("home");
    app.querySelectorAll(".opt").forEach((el) => {
      el.onclick = () => {
        if (state.picked !== null) return;
        state.picked = Number(el.dataset.i);
        if (state.picked === c.a) qz.score += 1;
        paint();
      };
    });
    const next = $("nextQ");
    if (next && !next.disabled) {
      next.onclick = () => { state.qI += 1; state.picked = null; paint(); };
    }
  }

  function wordsView() {
    const q = state.search.trim().toLowerCase();
    const items = Object.entries(STUDY.cards)
      .filter(([, c]) => !q || (c.term + " " + c.aka + " " + c.one).toLowerCase().includes(q))
      .map(([id, c]) =>
        `<button class="gitem" data-id="${id}"><b>${c.term}</b><span>${c.one}</span></button>`
      ).join("");

    app.classList.add("wide");
    app.classList.remove("study");
    app.innerHTML = `
      ${topbar("Words", "The whole pocket list")}
      <div class="pad">
        <input class="search sans" id="q" placeholder="Find a word" value="${escapeAttr(state.search)}">
        ${items || "<p class='aka'>Nothing matches.</p>"}
      </div>`;
    const input = $("q");
    input.oninput = () => { state.search = input.value; wordsView(); bindChrome(); };
    input.focus();
    const pos = input.value.length;
    input.setSelectionRange(pos, pos);
    app.querySelectorAll("[data-id]").forEach((el) => {
      el.onclick = () => {
        openCard(el.dataset.id);
      };
    });
  }

  function escapeAttr(s) {
    return String(s).replace(/"/g, "&quot;");
  }

  function bindChrome() {
    const t = $("theme");
    if (t) t.onclick = () => {
      state.store.theme = state.store.theme === "dark" ? "light" : "dark";
      persist();
      document.documentElement.setAttribute("data-theme", state.store.theme === "dark" ? "dark" : "light");
      document.querySelector('meta[name="theme-color"]').setAttribute(
        "content", state.store.theme === "dark" ? "#161411" : "#F3EDE3"
      );
      paint();
    };
    nav.innerHTML = `
      <button data-v="home" class="${state.view === "home" || state.view === "card" ? "on" : ""}">Cards</button>
      <button data-v="quizall" class="${state.view === "quiz" ? "on" : ""}">Quiz</button>
      <button data-v="words" class="${state.view === "words" ? "on" : ""}">Words</button>`;
    nav.querySelectorAll("button").forEach((b) => {
      b.onclick = () => {
        if (b.dataset.v === "quizall") startQuiz(allIds(), "All cards");
        else go(b.dataset.v);
      };
    });
  }

  function paint() {
    if (state.view === "home") home();
    else if (state.view === "card") cardView();
    else if (state.view === "quiz") quizView();
    else if (state.view === "words") wordsView();
    bindChrome();
  }

  paint();
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then(function (reg) {
      reg.update();
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
